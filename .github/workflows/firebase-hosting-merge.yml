name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔹 Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.3'  # Flutter version with Dart 3.8+
          channel: stable

      # 🔹 Disable analytics (optional but prevents banner)
      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      # 🔹 Verify Flutter and Dart version
      - name: Check Flutter and Dart version
        run: |
          flutter --version
          dart --version

      # 🔹 Clean previous builds (optional)
      - name: Clean Flutter project
        run: flutter clean

      # 🔹 Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🔹 Build Flutter Web
      - name: Build Flutter Web
        run: flutter build web --release

      # 🔹 Deploy to Firebase Hosting
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONFIX_MECHANIC_FINDER }}"
          channelId: live
          projectId: onfix-mechanic-finder
