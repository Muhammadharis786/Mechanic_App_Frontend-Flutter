name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔹 Remove old Flutter cache (force fresh download)
      - name: Remove old Flutter
        run: rm -rf $HOME/flutter

      # 🔹 Setup Flutter (explicitly install latest stable 3.13.x)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.3'
          channel: stable
          cache: false  # avoid cached old version

      # 🔹 Disable analytics
      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      # 🔹 Verify Flutter and Dart version
      - name: Check Flutter and Dart version
        run: |
          flutter --version
          dart --version

      # 🔹 Clean project
      - name: Clean Flutter project
        run: flutter clean

      # 🔹 Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🔹 Build Flutter Web
      - name: Build Flutter Web
        run: flutter build web --release

      # 🔹 Deploy to Firebase Hosting
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONFIX_MECHANIC_FINDER }}"
          channelId: live
          projectId: onfix-mechanic-finder
